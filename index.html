<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no">
<title>单词先学后默 · 七年级上册</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#f4f6fb;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#223}
button{font-family:inherit;touch-action:manipulation;border:0;border-radius:14px;font-size:18px;background:#e6eaf2;color:#334;min-height:54px;padding:0 12px}
button:active{filter:brightness(.92)}
button.pri{background:#4c8bf5;color:#fff}
button.ok{background:#1fae5b;color:#fff}
button.warn{background:#ff9f2e;color:#fff}
button:disabled{opacity:.4}
.view{display:none;flex-direction:column;height:100%;height:100dvh;max-width:900px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.view.on{display:flex}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.hdr .t{font-size:16px;color:#556;font-weight:600;flex:1;text-align:center}
.hdr button{min-height:40px;font-size:15px;padding:0 12px;background:#e9edf5}
.hdr .sp{width:64px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1}
.big{font-size:20px;min-height:62px}
h1{font-size:26px;text-align:center;margin:14px 0 4px}
.sub{text-align:center;color:#778;font-size:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 1px 3px #0001}
.pbar{height:10px;background:#dde3ee;border-radius:5px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:#4c8bf5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.grid button{min-height:56px;font-size:15px;padding:2px;line-height:1.2}
.grid button.done{background:#d9f3e3;color:#1a7a40}
.grid button.cur{outline:3px solid #4c8bf5}
/* learn */
.lw{text-align:center;font-size:52px;font-weight:700;letter-spacing:1px;margin-top:6px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.ipa{text-align:center;font-size:22px;color:#557;margin-top:4px;font-family:"Lucida Sans Unicode","Arial Unicode MS",-apple-system,sans-serif}
.mean{text-align:center;font-size:24px;margin-top:10px}
.mean .pos{color:#8a6;font-size:18px;margin-right:6px;font-style:italic}
.ex{font-size:19px;line-height:1.5;margin-top:4px}
.exzh{font-size:16px;color:#778;margin-top:4px}
.snd{background:#eaf1ff;color:#2e6be6;min-height:46px;font-size:17px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:5px;background:#cfd6e4}
.dots i.on{background:#4c8bf5}
/* dictate */
.zh{text-align:center;font-size:clamp(28px,8.5vw,46px);font-weight:700;margin:4px 0 0;line-height:1.3}
.hint{text-align:center;font-size:18px;color:#c80;min-height:24px;letter-spacing:2px}
#pad{position:relative;flex:1;min-height:200px;background:#fff;border:2px solid #cfd8ea;border-radius:14px;margin:6px 0;touch-action:none;overflow:hidden}
#pad canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#pad .ph{position:absolute;left:0;right:0;top:12px;text-align:center;color:#bbc;font-size:14px;pointer-events:none}
#reveal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#fffbe9ee;font-size:44px;font-weight:700;color:#c55a00}
#reveal small{font-size:16px;color:#886;font-weight:400}
.fb{text-align:center;font-size:20px;min-height:28px;font-weight:600}
.fb.ok{color:#1a9a4b}.fb.bad{color:#d33}
.read{text-align:center;font-size:14px;color:#778;min-height:18px}
.btns{display:flex;gap:8px;margin-top:6px}
.btns button{flex:1;font-size:17px;min-height:56px;padding:0}
/* lists */
.item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px}
.item .w{font-size:20px;font-weight:700}
.item .m{font-size:14px;color:#667;margin-top:2px}
.item .c{font-size:13px;color:#d33}
.item .f{flex:1;min-width:0}
.item button{min-height:42px;font-size:15px;padding:0 10px}
.ok-t{color:#1a9a4b}.bad-t{color:#d33}
#loading{position:fixed;inset:0;background:#f4f6fbee;display:flex;align-items:center;justify-content:center;font-size:18px;color:#557;z-index:9}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#000c;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:20;display:none}

.dtop{flex:none}
.dmain{flex:1;display:flex;flex-direction:column;min-height:0}
#pad .padfb{position:absolute;left:0;right:0;bottom:6px;pointer-events:none;text-align:center}
#pad .padfb .fb{min-height:0}
.btns #submit{flex:1.5}
#rotTip{position:fixed;inset:0;background:#0007;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#rotTip .box{background:#fff;border-radius:18px;padding:20px;text-align:center;max-width:420px}
/* ===== 横屏（真实横屏或模拟横屏）===== */
body.land .view{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom))}
body.land #vDict{display:none}
body.land #vDict.on{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;gap:4px 8px}
body.land #vDict .hdr{grid-column:1/3;min-height:38px}
body.land #vDict .hdr button{min-height:34px}
body.land #vDict .hdr .t{flex:none;text-align:left;font-size:14px}
body.land #vDict .dtop{display:none}
body.land #vDict .hdr .zhL{display:block}
body.land #vDict .dmain{grid-column:1/3;flex-direction:row;gap:8px}
body.land #pad{margin:0;min-height:0}
body.land .btns{flex-direction:column;margin:0;width:104px;gap:6px}
body.land .btns button{min-height:0;flex:1;font-size:17px}
body.land .btns #submit{flex:1.6}
body.land #rotBtn{display:none}
body.land.sim #rotBtn{display:inline-block}
.zhL{display:none;flex:1;text-align:center;font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zhL small{font-size:15px;color:#c80;font-weight:400;margin-left:8px;letter-spacing:1px}
body.land #vLearn .scroll{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-content:start}
body.land #vLearn .lw{font-size:44px}
body.land #vLearn .dots{grid-column:1/3}
body.land #vLearn .row .big,body.land #vSum .row .big{min-height:50px}
body.land .grid{grid-template-columns:repeat(7,1fr)}
body.land h1{margin:6px 0 2px}
/* 模拟横屏：把默写页旋转 90°（手机向左横放）*/
body.sim #vDict.on{position:fixed;left:0;top:0;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);max-width:none;margin:0;
  padding:6px calc(8px + env(safe-area-inset-bottom)) 8px calc(8px + env(safe-area-inset-top))}
</style>
</head>
<body>
<!-- 首页 -->
<div class="view" id="vHome">
  <div class="scroll">
    <h1>单词先学后默</h1>
    <div class="sub">人教版七年级上册 · 100 个单词 · 每组 5 个</div>
    <div class="card">
      <div id="homeProg" style="font-size:16px"></div>
      <div class="pbar"><i id="homeBar"></i></div>
      <div class="row"><button class="pri big" id="btnContinue">继续学习</button></div>
      <div class="row"><button class="big" id="btnMistakes">错题本</button></div>
    </div>
    <div class="card">
      <div style="font-size:16px;font-weight:600">选择分组</div>
      <div class="grid" id="groupGrid"></div>
    </div>
    <div class="sub" style="margin:14px 0 6px">提示：先点"发音"听一遍；手写时字母之间稍微分开一点</div>
  </div>
</div>
<!-- 学习 -->
<div class="view" id="vLearn">
  <div class="hdr"><button id="learnBack">‹ 首页</button><div class="t" id="learnTitle"></div><div class="sp"></div></div>
  <div class="scroll">
    <div class="card">
      <div class="lw" id="lWord"></div>
      <div class="ipa" id="lIpa"></div>
      <div class="row"><button class="snd" id="lSay">🔊 发音</button></div>
      <div class="mean"><span class="pos" id="lPos"></span><span id="lZh"></span></div>
    </div>
    <div class="card">
      <div style="font-size:14px;color:#99a">例句</div>
      <div class="ex" id="lEx"></div>
      <div class="exzh" id="lExZh"></div>
      <div class="row"><button class="snd" id="lSayEx">🔊 例句发音</button></div>
    </div>
    <div class="dots" id="lDots"></div>
  </div>
  <div class="row"><button class="big" id="lPrev">上一个</button><button class="pri big" id="lNext">下一个</button></div>
</div>
<!-- 默写 -->
<div class="view" id="vDict">
  <div class="hdr"><button id="dictBack">‹ 首页</button><div class="t" id="dictTitle"></div><div class="zhL" id="dZhL"></div><button id="rotBtn">↻ 横屏书写</button><button id="dSay">🔊 听</button></div>
  <div class="dtop"><div class="zh" id="dZh"></div><div class="hint" id="dHint"></div></div>
  <div class="dmain">
    <div id="pad"><canvas id="bg"></canvas><canvas id="cv"></canvas><div class="ph" id="ph">在这里手写英文单词（字母之间稍微分开一点）</div>
      <div class="padfb"><div class="fb" id="fb"></div><div class="read" id="read"></div></div>
      <div id="reveal"><small>正确拼写</small><span id="revealW"></span></div></div>
    <div class="btns">
      <button id="undo">撤销</button>
      <button id="clear">清除</button>
      <button id="hintBtn">提示</button>
      <button class="warn" id="skip" style="display:none">跳过</button>
      <button class="pri" id="submit">提交</button>
    </div>
  </div>
</div>
<div id="rotTip"><div class="box">
  <div style="font-size:54px">📱↻</div>
  <div style="font-size:20px;font-weight:700;margin:8px 0">请把手机横过来</div>
  <div style="font-size:15px;color:#667;line-height:1.6">如果横过来画面不转，请从右上角下拉打开「控制中心」，<br>关闭「竖排方向锁定」🔒 后再试。<br>也可以直接用下面的「模拟横屏」（手机向左横放）。</div>
  <div class="row"><button id="rotSim" class="pri">模拟横屏</button><button id="rotClose">知道了</button></div>
</div></div>
<!-- 小结 -->
<div class="view" id="vSum">
  <div class="scroll">
    <h1 id="sumTitle">本组完成！</h1>
    <div class="card" style="text-align:center;font-size:22px"><span class="ok-t" id="sumOk"></span>　　<span class="bad-t" id="sumBad"></span></div>
    <div id="sumList"></div>
  </div>
  <div class="row"><button class="big" id="sumRetry">重练本组</button><button class="pri big" id="sumNext">下一组</button></div>
  <div class="row"><button id="sumHome">回首页</button></div>
</div>
<!-- 错题本 -->
<div class="view" id="vMist">
  <div class="hdr"><button id="mistBack">‹ 首页</button><div class="t">错题本</div><div class="sp"></div></div>
  <div class="sub" id="mistInfo"></div>
  <div class="scroll" id="mistList"></div>
  <div class="row"><button class="pri big" id="mistPractice">练习错题（每次 5 个）</button></div>
</div>
<div id="loading">正在加载…</div>
<div class="toast" id="toast"></div>
<script>
// 人教版（2024新版）英语七年级上册 词汇（单个单词，共100个）；音标为英式，例句为课本风格简单句
window.WORDS=[{"w": "unit", "zh": "单元", "u": "Starter Unit 1", "pos": "n.", "ipa": "/ˈjuːnɪt/", "ex": "Let's start Unit 1.", "exzh": "我们开始学第一单元吧。"}, {"w": "section", "zh": "部分；地区", "u": "Starter Unit 1", "pos": "n.", "ipa": "/ˈsekʃn/", "ex": "Please read Section A.", "exzh": "请读A部分。"}, {"w": "greet", "zh": "问候；打招呼", "u": "Starter Unit 1", "pos": "v.", "ipa": "/ɡriːt/", "ex": "We greet our teacher every morning.", "exzh": "我们每天早上向老师问好。"}, {"w": "everyone", "zh": "每个人；大家", "u": "Starter Unit 1", "pos": "pron.", "ipa": "/ˈevriwʌn/", "ex": "Good morning, everyone!", "exzh": "大家早上好！"}, {"w": "start", "zh": "开始", "u": "Starter Unit 1", "pos": "v.", "ipa": "/stɑːt/", "ex": "Let's start the class.", "exzh": "我们开始上课吧。"}, {"w": "spell", "zh": "拼写", "u": "Starter Unit 1", "pos": "v.", "ipa": "/spel/", "ex": "Can you spell your name?", "exzh": "你能拼写你的名字吗？"}, {"w": "bell", "zh": "铃；钟", "u": "Starter Unit 1", "pos": "n.", "ipa": "/bel/", "ex": "The bell is ringing.", "exzh": "铃响了。"}, {"w": "bottle", "zh": "瓶子", "u": "Starter Unit 2", "pos": "n.", "ipa": "/ˈbɒtl/", "ex": "This is my water bottle.", "exzh": "这是我的水瓶。"}, {"w": "eraser", "zh": "橡皮", "u": "Starter Unit 2", "pos": "n.", "ipa": "/ɪˈreɪzə(r)/", "ex": "Is this your eraser?", "exzh": "这是你的橡皮吗？"}, {"w": "key", "zh": "钥匙；关键", "u": "Starter Unit 2", "pos": "n.", "ipa": "/kiː/", "ex": "I can't find my key.", "exzh": "我找不到我的钥匙了。"}, {"w": "thing", "zh": "东西；事情", "u": "Starter Unit 2", "pos": "n.", "ipa": "/θɪŋ/", "ex": "Put your things in your bag.", "exzh": "把你的东西放进书包里。"}, {"w": "fun", "zh": "乐趣；有趣的", "u": "Starter Unit 3", "pos": "n.&adj.", "ipa": "/fʌn/", "ex": "Learning English is fun.", "exzh": "学英语很有趣。"}, {"w": "yard", "zh": "院子", "u": "Starter Unit 3", "pos": "n.", "ipa": "/jɑːd/", "ex": "There are many flowers in the yard.", "exzh": "院子里有很多花。"}, {"w": "carrot", "zh": "胡萝卜", "u": "Starter Unit 3", "pos": "n.", "ipa": "/ˈkærət/", "ex": "Rabbits like carrots.", "exzh": "兔子喜欢胡萝卜。"}, {"w": "goose", "zh": "鹅", "u": "Starter Uni <script>
// 手写单词识别：笔画分组切分成字母 + 本地 CNN（EMNIST letters 训练）逐字母识别。完全离线、免费。
(function(){
const LET='abcdefghijklmnopqrstuvwxyz';
let W=null; // weights
function f16(h){const o=new Float32Array(h.length);for(let i=0;i<h.length;i++){const x=h[i],s=x&0x8000?-1:1,e=(x>>10)&31,m=x&1023;
  o[i]=e===0?s*m*Math.pow(2,-24):e===31?(m?NaN:s*Infinity):s*(1+m/1024)*Math.pow(2,e-15);}return o;}
async function loadModel(base){
  base=base||'';
  let man,all;
  if(window.MODEL_EMBED){man=window.MODEL_EMBED.man;const bin=atob(window.MODEL_EMBED.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);all=f16(new Uint16Array(u.buffer));}
  else{let buf;[man,buf]=await Promise.all([fetch(base+'model.json').then(r=>r.json()),fetch(base+'model.bin').then(r=>r.arrayBuffer())]);all=new Float32Array(buf);}
  W={};
  for(const [k,shape,off] of man){const n=shape.reduce((a,b)=>a*b,1);W[k]={d:all.subarray(off,off+n),s:shape};}
}
function conv(x,C,H,Wd,name){ // 3x3 pad1 + relu
  const w=W[name+'.weight'],b=W[name+'.bias'].d,O=w.s[0],wd=w.d,out=new Float32Array(O*H*Wd);
  for(let o=0;o<O;o++){const ob=o*H*Wd;
    for(let i=0;i<H*Wd;i++)out[ob+i]=b[o];
    for(let c=0;c<C;c++){const xb=c*H*Wd,wb=(o*C+c)*9;
      for(let ky=0;ky<3;ky++)for(let kx=0;kx<3;kx++){const wv=wd[wb+ky*3+kx];if(wv===0)continue;
        const dy=ky-1,dx=kx-1;
        const y0=Math.max(0,-dy),y1=Math.min(H,H-dy),x0=Math.max(0,-dx),x1=Math.min(Wd,Wd-dx);
        for(let y=y0;y<y1;y++){const orow=ob+y*Wd,irow=xb+(y+dy)*Wd+dx;
          for(let xx=x0;xx<x1;xx++)out[orow+xx]+=wv*x[irow+xx];}}}
    for(let i=0;i<H*Wd;i++)if(out[ob+i]<0)out[ob+i]=0;}
  return out;
}
function pool(x,C,H,Wd){const h=H>>1,w=Wd>>1,out=new Float32Array(C*h*w);
  for(let c=0;c<C;c++)for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=c*H*Wd+2*y*Wd+2*xx;
    out[c*h*w+y*w+xx]=Math.max(x[i],x[i+1],x[i+Wd],x[i+Wd+1]);}return out;}
function linear(x,name,relu){const w=W[name+'.weight'],b=W[name+'.bias'].d,O=w.s[0],I=w.s[1],out=new Float32Array(O);
  for(let o=0;o<O;o++){let s=b[o];const wb=o*I;for(let i=0;i<I;i++)s+=w.d[wb+i]*x[i];out[o]=relu&&s<0?0:s;}return out;}
function classify(img){ // img Float32Array 784, 1=ink
  const ch=k=>W[k+'.weight'].s[0];
  let x=conv(img,1,28,28,'c1');x=conv(x,ch('c1'),28,28,'c2');x=pool(x,ch('c2'),28,28);
  x=conv(x,ch('c2'),14,14,'c3');x=conv(x,ch('c3'),14,14,'c4');x=pool(x,ch('c4'),14,14);
  x=conv(x,ch('c4'),7,7,'c5');x=pool(x,ch('c5'),7,7);
  x=linear(x,'f1',true);x=linear(x,'f2',false);
  const m=Math.max(...x);let s=0;const p=Array.from(x,v=>{const e=Math.exp(v-m);s+=e;return e;});return p.map(v=>v/s);
}
// ---------- 笔画处理 ----------
function bbox(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);}return{x0:a,y0:b,x1:c,y1:d};}
function groupStrokes(strokes){
  strokes=strokes.filter(s=>s.length);
  if(!strokes.length)return[];
  const all=bbox(strokes.flat()),H=Math.max(all.y1-all.y0,1);
  const info=strokes.map(s=>({s:[s],b:bbox(s)}));
  const big=[],small=[];
  for(const it of info){const w=it.b.x1-it.b.x0,h=it.b.y1-it.b.y0;(Math.max(w,h)<0.18*H?small:big).push(it);}
  if(!big.length)big.push(...small.splice(0));
  // 并查集：横向重叠明显、或彼此相接的笔画归为同一个字母（t、x、k、n、h、b 等多笔字母）
  const par=big.map((_,i)=>i),find=i=>par[i]===i?i:(par[i]=find(par[i]));
  const md=(A,B)=>{let m=1e9;const st=Math.max(1,Math.floor(A.length/40)),st2=Math.max(1,Math.floor(B.length/40));
    for(let i=0;i<A.length;i+=st)for(let j=0;j<B.length;j+=st2){const d=Math.hypot(A[i][0]-B[j][0],A[i][1]-B[j][1]);if(d<m)m=d;}return m;};
  for(let i=0;i<big.length;i++)for(let j=i+1;j<big.length;j++){
    const A=big[i].b,B=big[j].b,ov=Math.min(A.x1,B.x1)-Math.max(A.x0,B.x0);
    const nw=Math.max(Math.min(A.x1-A.x0,B.x1-B.x0),0.08*H);
    if(ov>0.6*nw)par[find(i)]=find(j);}
  const gm={};
  big.forEach((it,i)=>{const r=find(i);if(!gm[r])gm[r]={s:[],b:{...it.b}};const g=gm[r];g.s.push(...it.s);
    g.b={x0:Math.min(g.b.x0,it.b.x0),y0:Math.min(g.b.y0,it.b.y0),x1:Math.max(g.b.x1,it.b.x1),y1:Math.max(g.b.y1,it.b.y1)};});
  const groups=Object.values(gm);
  for(const it of small)groups.push({s:[...it.s],b:{...it.b},dot:true});
  groups.sort((a,b)=>(a.b.x0+a.b.x1)-(b.b.x0+b.b.x1));
  return groups.map(g=>({s:g.s,cx0:-Infinity,cx1:Infinity,b:g.b,H,dot:!!g.dot}));
}
// 段的有效包围盒（考虑横向裁剪）
function segBox(seg){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const s of seg.s){for(let i=0;i<s.length;i++){
    const p=s[i];const pts=[p];
    if(i>0){const q=s[i-1];for(const X of [seg.cx0,seg.cx1])if(isFinite(X)&&(q[0]-X)*(p[0]-X)<0){const t=(X-q[0])/(p[0]-q[0]);pts.push([X,q[1]+t*(p[1]-q[1])]);}}
    for(const r of pts)if(r[0]>=seg.cx0&&r[0]<=seg.cx1){a=Math.min(a,r[0]);b=Math.min(b,r[1]);c=Math.max(c,r[0]);d=Math.max(d,r[1]);}
  }}
  return a>c?null:{x0:a,y0:b,x1:c,y1:d};
}
const S=4,N=28*S;let cv=null;
function getCanvas(){if(!cv){cv=document.createElement('canvas');cv.width=cv.height=N;}return cv;}
function renderSeg(seg){
  const bb=segBox(seg);if(!bb)return null;
  const w=bb.x1-bb.x0,h=bb.y1-bb.y0,m=Math.max(w,h,1e-3),sc=22*S/m;
  const c=getCanvas(),g=c.getContext('2d',{willReadFrequently:true});
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,N,N);
  g.save();

  g.beginPath();g.rect((isFinite(seg.cx0)?seg.cx0*sc+ox:0),0,(isFinite(seg.cx1)?seg.cx1*sc+ox:N)-(isFinite(seg.cx0)?seg.cx0*sc+ox:0),N);g.clip();
  g.strokeStyle='#fff';g.fillStyle='#fff';g.lineWidth=2.6*S;g.lineCap='round';g.lineJoin='round';
  for(const s of seg.s){
    if(s.length===1||(Math.abs(bbox(s).x1-bbox(s).x0)+Math.abs(bbox(s).y1-bbox(s).y0))*sc<1.5*S){const p=s[0];g.beginPath();g.arc(p[0]*sc+ox,p[1]*sc+oy,1.6*S,0,7);g.fill();continue;}
    g.beginPath();g.moveTo(s[0][0]*sc+ox,s[0][1]*sc+oy);for(let i=1;i<s.length;i++)g.lineTo(s[i][0]*sc+ox,s[i][1]*sc+oy);g.stroke();
  }

  const o=new Float32Array(784);const k=[0.25,0.5,0.25];
  const t=new Float32Array(784);
  for(let y=0;y<28;y++)for(let x=0;x<28;x++){let s=0;for(let j=-1;j<=1;j++){const xx=x+j;if(xx>=0&&xx<28)s+=k[j+1]*img[y*28+xx];}t[y*28+x]=s;}
  for(let y=0;y<28;y++)for(let x=0;x<28;x++){let s=0;for(let j=-1;j<=1;j++){const yy=y+j;if(yy>=0&&yy<28)s+=k[j+1]*t[yy*28+x];}o[y*28+x]=Math.min(1,s*1.25);}
  return o;
}
// 在墨迹最少的列把一段切成两段（用于连笔字母）
function splitSeg(seg){
  const bb=segBox(seg);if(!bb)return null;
  const w=bb.x1-bb.x0,B=40,col=new Float32Array(B);
  for(const s of seg.s)for(let i=1;i<s.length;i++){const p=s[i-1],q=s[i],n=Math.max(2,Math.ceil(Math.hypot(q[0]-p[0],q[1]-p[1])/(w/B/2)));
    for(let k=0;k<=n;k++){const x=p[0]+(q[0]-p[0])*k/n;if(x<seg.cx0||x>seg.cx1)continue;const ci=Math.min(B-1,Math.max(0,Math.floor((x-bb.x0)/w*B)));col[ci]+=1;}}
  let bi=-1,bv=1e9;for(let i=Math.floor(B*0.25);i<=Math.ceil(B*0.75);i++){const v=col[i]+(i>0?col[i-1]:0)*0.5+(i<B-1?col[i+1]:0)*0.5;if(v<bv){bv=v;bi=i;}}
  const X=bb.x0+(bi+0.5)/B*w;
  return [{...seg,cx1:X},{...seg,cx0:X}];
}
function segAspect(seg){const b=segBox(seg);if(!b)return 0;return (b.x1-b.x0)/Math.max(seg.H*0.5,b.y1-b.y0,1e-3);}
function gap(a,b){const A=segBox(a),B=segBox(b);return B.x0-A.x1;}
function mergeSeg(a,b){return {s:[...new Set([...a.s,...b.s])],cx0:a.cx0,cx1:b.cx1,H:a.H};}
// 基本单元：自然分组；过宽的组（连笔）在墨迹最少处继续切开
function primitives(groups){
  const out=[];
  for(const g of groups){
    if(g.dot){out.push(g);continue;}
    let pieces=[g];
    for(let k=0;k<6;k++){let wi=-1,wa=0.95;pieces.forEach((p,i)=>{const a=segAspect(p);if(a>wa){wa=a;wi=i;}});
      if(wi<0)break;const sp=splitSeg(pieces[wi]);if(!sp)break;pieces.splice(wi,1,...sp);}
    out.push(...pieces);
  }
  return out;
}
function joinRun(prims,i,j){ // prims[i..j)
  if(j-i===1)return prims[i];
  const r=prims.slice(i,j),s=[...new Set(r.flatMap(p=>p.s))];
  const nd=r.filter(p=>!p.dot);
  if(!nd.length)return {s,cx0:-Infinity,cx1:Infinity,H:prims[i].H,dot:true};
  return {s,cx0:nd[0].cx0,cx1:nd[nd.length-1].cx1,H:prims[i].H};
}
// 形状几乎相同的字母对（大小写混用时无法区分）
const SAME=[['i','l'],['l','i'],['g','q'],['q','g'],['u','v'],['v','u']];
function letterOK(p,t){const ti=LET.indexOf(t),top=p.indexOf(Math.max(...p));
  if(top===ti)return true;
  if(p[ti]>=0.30)return true;
  if(SAME.some(([a,b])=>a===t&&b===LET[top])&&p[ti]>=0.04)return true;
  return false;}
const MAXRUN=4;
function recognize(strokes,target){
  target=(target||'').trim().toLowerCase();
  const groups=groupStrokes(strokes);
  if(!groups.length)return{ok:false,text:'',reason:'empty'};
  const H=groups[0].H,prims=primitives(groups),P=prims.length;
  const cache={};
  function probs(i,j){const k=i+','+j;if(k in cache)return cache[k];
    let r=null;const seg=joinRun(prims,i,j);if(seg.dot)return cache[k]=null;const b=segBox(seg);
    if(b){const a=(b.x1-b.x0)/Math.max(b.y1-b.y0,0.45*H,1e-3);
      if(j-i===1||a<=1.9){const im=renderSeg(seg);r=im?classify(im):null;if(r){r.a=j-i===1?0:a;}}}
    return cache[k]=r;}
  const wide=(p,c)=>p.a>(('mw'.includes(c))?1.9:1.25);
  // 自由识别（用于显示“识别结果”）
  const f=new Array(P+1).fill(-1e9),fb=new Array(P+1);f[0]=0;
  for(let j=1;j<=P;j++)for(let i=Math.max(0,j-MAXRUN);i<j;i++){const p=probs(i,j);if(!p||f[i]<=-1e9)continue;
    const m=Math.max(...p.slice(0,26));if(wide(p,LET[p.indexOf(m)]))continue;const v=f[i]+Math.log(m)-0.1;if(v>f[j]){f[j]=v;fb[j]=[i,LET[p.indexOf(m)]];}}
  let raw='';if(fb[P])for(let j=P;j>0;j=fb[j][0])raw=fb[j][1]+raw;
  // 按目标单词对齐
  const n=target.length;let ok=false;
  if(n&&/^[a-z]+$/.test(target)&&P>=n&&P<=n*MAXRUN){
    const dp=[...Array(P+1)].map(()=>new Array(n+1).fill(-1e9)),bk=[...Array(P+1)].map(()=>new Array(n+1));dp[0][0]=0;
    for(let j=1;j<=P;j++)for(let i=Math.max(0,j-MAXRUN);i<j;i++){const p=probs(i,j);if(!p)continue;
      for(let l=1;l<=n;l++){if(dp[i][l-1]<=-1e9||wide(p,target[l-1]))continue;const v=dp[i][l-1]+Math.log(p[LET.indexOf(target[l-1])]+1e-9);
        if(v>dp[j][l]){dp[j][l]=v;bk[j][l]=i;}}}
    var margin=dp[P][n]>-1e9?f[P]-(dp[P][n]-0.1*n):1e9;
    if(dp[P][n]>-1e9&&(raw===target||margin<(HW.MARGIN||1.5))){ok=true;let j=P;for(let l=n;l>0;l--){const i=bk[j][l];if(!letterOK(probs(i,j),target[l-1])){ok=false;break;}j=i;}}
  }
  let path=[];if(n&&typeof dp!=='undefined'){}
  if(HW.debug&&fb[P]){const d=[];for(let j=P;j>0;j=fb[j][0]){const i=fb[j][0],p=probs(i,j);d.unshift([i,j,fb[j][1],Math.max(...p.slice(0,26)).toFixed(2),p.a.toFixed(2),(p[26]||0).toFixed(2)]);}
    HW.dbg={P,free:d,prims:prims.map(p=>{const b=segBox(p);return [Math.round(b.x0),Math.round(b.x1),p.dot?1:0];}),
     single:prims.map((p,i)=>{const q=probs(i,i+1);if(!q)return '.';const o=[...q.keys()].sort((a,b)=>q[b]-q[a]);const L2=LET+'#';return L2[o[0]]+q[o[0]].toFixed(2)+L2[o[1]]+q[o[1]].toFixed(2);})};}
  return {ok,text:ok?target:raw,raw,n:raw.length,margin:typeof margin==='undefined'?null:margin};
}
window.HW={loadModel,recognize,groupStrokes,classify,renderSeg};
})();

</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const WORDS=window.WORDS, G=5, NG=Math.ceil(WORDS.length/G);
const byW={};WORDS.forEach((w,i)=>{w.i=i;byW[w.w]=w;});
// ---------- 存储 ----------
const KEY='spell7a_v2';
let st={cur:0,done:{},mist:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||1500);}
// ---------- 视图 ----------
let sim=false,curView='';
function show(id){curView=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));updLand();}
// 横屏：真实横屏，或在默写页使用“模拟横屏”（CSS 旋转 90°）
function updLand(){
  const real=window.innerWidth>window.innerHeight;
  if(real&&sim)sim=false;
  if(real){const t=document.getElementById('rotTip');if(t)t.style.display='none';}
  const useSim=sim&&curView==='vDict';
  document.body.classList.toggle('sim',useSim);
  document.body.classList.toggle('land',real||useSim);
  const v=document.getElementById('vDict');
  if(useSim){v.style.width=window.innerHeight+'px';v.style.height=window.innerWidth+'px';}else{v.style.width='';v.style.height='';}
  const rb=document.getElementById('rotBtn');if(rb)rb.textContent=useSim?'↺ 退出模拟':'↻ 横屏书写';
  if(curView==='vDict'&&typeof resize==='function')requestAnimationFrame(resize);
}
// ---------- 发音：有道词典真人发音（国内可用），失败时用浏览器语音合成 ----------
const au=new Audio();au.preload='auto';
function pickVoice(){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  return vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));}
function tts(text,slow){
  if(!window.speechSynthesis){toast('当前浏览器不支持发音');return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=pickVoice();
  if(v)u.voice=v;u.lang=v?v.lang:'en-GB';u.rate=slow?0.8:0.9;speechSynthesis.speak(u);
  window.__audioLog&&window.__audioLog.push('tts:'+text);}
let sayToken=0;
// 发音来源链：单词 = 有道真人发音 → 本站录音 → 浏览器语音；例句 = 本站录音（英音 Sonia）→ 浏览器语音
function say(text,slow,kind,key){
  const tok=++sayToken;
  try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}
  const yd='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type=1';
  const local='audio/'+(kind==='s'?'s':'w')+'/'+encodeURIComponent(key||text)+'.mp3';
  const srcs=kind==='s'?[local]:[yd,local];
  let k=-1,timer=null;
  const tryNext=()=>{if(tok!==sayToken)return;clearTimeout(timer);k++;
    if(k>=srcs.length){try{au.pause();}catch(e){}tts(text,slow);return;}
    let settled=false;const src=srcs[k];
    const fail=()=>{if(settled||tok!==sayToken)return;settled=true;tryNext();};
    au.onplaying=()=>{if(tok!==sayToken||settled)return;settled=true;clearTimeout(timer);window.__audioLog&&window.__audioLog.push((src===yd?'youdao:':'local:')+text);};
    au.onerror=fail;au.src=src;
    try{const p=au.play();if(p&&p.catch)p.catch(err=>{if(err&&err.name==='AbortError')return;fail();});}catch(e){fail();}
    timer=setTimeout(fail,3000);};
  tryNext();
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
// ---------- 会话 ----------
let S=null; // {mode:'group'|'mist',g,words,i,res:{w:{wrong,skip}}}
function startGroup(g){S={mode:'group',g,words:WORDS.slice(g*G,g*G+G),i:0,res:{}};learnShow();}
function mistWords(){return Object.keys(st.mist).filter(w=>byW[w]).sort((a,b)=>st.mist[b].n-st.mist[a].n||st.mist[a].t-st.mist[b].t);}
function startMist(){const ws=mistWords().slice(0,G);if(!ws.length){toast('错题本是空的 👍');return;}
  S={mode:'mist',words:ws.map(w=>byW[w]),i:0,res:{}};learnShow();}
function title(){return S.mode==='mist'?'错题练习':'第 '+(S.g+1)+' 组';}
// ---------- 学 ----------
function learnShow(){
  show('vLearn');const w=S.words[S.i];
  $('learnTitle').textContent=title()+' · 学 '+(S.i+1)+'/'+S.words.length;
  $('lWord').textContent=w.w;$('lIpa').textContent=w.ipa;$('lPos').textContent=w.pos;$('lZh').textContent=w.zh;
  $('lEx').textContent=w.ex;$('lExZh').textContent=w.exzh;
  $('lDots').innerHTML=S.words.map((_,k)=>'<i class="'+(k===S.i?'on':'')+'"></i>').join('');
  $('lPrev').disabled=S.i===0;
  const last=S.i===S.words.length-1;$('lNext').textContent=last?'开始默写 ✍️':'下一个';$('lNext').className=last?'ok big':'pri big';
}
$('lSay').onclick=()=>say(S.words[S.i].w,true);
$('lSayEx').onclick=()=>say(S.words[S.i].ex,false,'s',S.words[S.i].w);
$('lPrev').onclick=()=>{if(S.i>0){S.i--;learnShow();}};
$('lNext').onclick=()=>{if(S.i<S.words.length-1){S.i++;learnShow();}else{S.i=0;dictShow();}};
$('learnBack').onclick=goHome;
// ---------- 默写 ----------
const pad=$('pad'),cv=$('cv'),bg=$('bg'),ctx=cv.getContext('2d');
let strokes=[],cur=null,hintN=0,busy=false,wrongThis=0;
let padW=0,padH=0;
function resize(){const W=pad.clientWidth,H=pad.clientHeight;if(!W||!H)return;const d=window.devicePixelRatio||1;
  // 尺寸变化（如转屏）时按比例缩放已写的笔画，保证不丢失
  if(padW&&padH&&(W!==padW||H!==padH)&&strokes.length){
    const f=strokes.flat(),x0=Math.min(...f.map(q=>q[0])),x1=Math.max(...f.map(q=>q[0])),y0=Math.min(...f.map(q=>q[1])),y1=Math.max(...f.map(q=>q[1]));
    const k=Math.min(1,W*0.9/Math.max(x1-x0,1),H*0.8/Math.max(y1-y0,1)),cx=(x0+x1)/2,cy=(y0+y1)/2; // 尽量保持原大小，放不下才缩小，并居中
    for(const s of strokes)for(const p of s){p[0]=(p[0]-cx)*k+W/2;p[1]=(p[1]-cy)*k+H/2;}}
  padW=W;padH=H;
  for(const c of [cv,bg]){c.width=Math.round(W*d);c.height=Math.round(H*d);c.getContext('2d').setTransform(d,0,0,d,0,0);}
  drawBg(W,H);redraw();}
function drawBg(w,h){const g=bg.getContext('2d');g.clearRect(0,0,w,h);
  const lh=Math.min(h*0.55,w*0.3),top=(h-lh)/2;g.lineWidth=1;
  [[0,'#e3e8f2'],[1/3,'#eef1f7'],[2/3,'#f3c4c4'],[1,'#e3e8f2']].forEach(([f,c])=>{g.strokeStyle=c;g.beginPath();g.moveTo(10,top+f*lh);g.lineTo(w-10,top+f*lh);g.stroke();});}
function redraw(){const r={width:pad.clientWidth,height:pad.clientHeight};ctx.clearRect(0,0,r.width,r.height);
  ctx.strokeStyle='#1d3c8f';ctx.fillStyle='#1d3c8f';ctx.lineWidth=Math.max(4,Math.min(7,r.height/45));ctx.lineCap='round';ctx.lineJoin='round';
  for(const s of strokes){if(s.length===1){ctx.beginPath();ctx.arc(s[0][0],s[0][1],ctx.lineWidth/2,0,7);ctx.fill();continue;}
    ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);for(let i=1;i<s.length;i++)ctx.lineTo(s[i][0],s[i][1]);ctx.stroke();}
  $('ph').style.display=strokes.length?'none':'block';}
function pos(e){const r=cv.getBoundingClientRect();
  if(document.body.classList.contains('sim'))return[e.clientY-r.top,r.right-e.clientX]; // 旋转 90° 后的坐标换算
  return[e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(busy)return;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);cur=[pos(e)];strokes.push(cur);clearFb();redraw();});
cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];for(const ev of (evs.length?evs:[e]))cur.push(pos(ev));redraw();});
cv.addEventListener('pointerup',()=>cur=null);cv.addEventListener('pointercancel',()=>cur=null);
pad.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
pad.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
function clearFb(){$('fb').textContent='';$('fb').className='fb';}
function dictShow(){
  show('vDict');const w=S.words[S.i];strokes=[];hintN=0;busy=false;wrongThis=0;
  $('dictTitle').textContent=title()+' · 默写 '+(S.i+1)+'/'+S.words.length;
  $('dZh').textContent=w.zh;$('dHint').textContent='';setZhL();$('skip').style.display='none';$('reveal').style.display='none';
  clearFb();$('read').textContent='';requestAnimationFrame(resize);}
function markWrong(w){const r=S.res[w.w]=S.res[w.w]||{};if(r.wrong)return;r.wrong=true;
  const m=st.mist[w.w]=st.mist[w.w]||{n:0,streak:0,t:Date.now()};m.n++;m.streak=0;save();}
function markRight(w){const r=S.res[w.w]=S.res[w.w]||{};
  if(S.mode==='mist'&&!r.wrong&&st.mist[w.w]){const m=st.mist[w.w];m.streak=(m.streak||0)+1;
    if(m.streak>=2){delete st.mist[w.w];r.cleared=true;}save();}}
function next(){if(S.i<S.words.length-1){S.i++;dictShow();}else finishSession();}
$('dSay').onclick=()=>say(S.words[S.i].w,true);
$('undo').onclick=()=>{if(busy)return;strokes.pop();clearFb();redraw();};
$('clear').onclick=()=>{if(busy)return;strokes=[];clearFb();$('read').textContent='';redraw();};
$('hintBtn').onclick=()=>{const w=S.words[S.i].w;if(hintN<w.length-1)hintN++;$('dHint').textContent='提示：'+w.slice(0,hintN)+'…';setZhL();};
$('skip').onclick=()=>{if(busy)return;busy=true;const w=S.words[S.i];markWrong(w);S.res[w.w].skip=true;
  $('revealW').textContent=w.w;$('reveal').style.display='flex';say(w.w,true);setTimeout(next,2200);};
$('submit').onclick=()=>{
  if(busy)return;const w=S.words[S.i];
  if(!strokes.length){$('fb').className='fb bad';$('fb').textContent='请先写单词';return;}
  busy=true;$('fb').className='fb';$('fb').textContent='识别中…';
  setTimeout(()=>{
    let r;try{r=HW.recognize(strokes,w.w);}catch(err){console.error(err);r={ok:false,text:''};}
    $('read').textContent='识别结果：'+(r.text||'（没看清）');
    if(r.ok){markRight(w);$('fb').className='fb ok';$('fb').textContent=S.res[w.w]&&S.res[w.w].cleared?'✓ 正确！已移出错题本 🎉':'✓ 正确！';setTimeout(next,1000);}
    else{busy=false;wrongThis++;markWrong(w);$('fb').className='fb bad';$('fb').textContent='✗ 不对哦，再改改';$('skip').style.display='';}
  },30);};
$('dictBack').onclick=()=>{if(confirm('退出本组？（已记录的错题会保留）'))goHome();};
// ---------- 小结 ----------
function finishSession(){
  const ok=S.words.filter(w=>!(S.res[w.w]&&S.res[w.w].wrong)),bad=S.words.filter(w=>S.res[w.w]&&S.res[w.w].wrong);

  show('vSum');$('sumTitle').textContent=(S.mode==='mist'?'错题练习':'第 '+(S.g+1)+' 组')+'完成！';
  $('sumOk').textContent='✓ 对 '+ok.length+' 个';$('sumBad').textContent='✗ 错 '+bad.length+' 个';
  $('sumList').innerHTML=S.words.map(w=>{const r=S.res[w.w]||{};const tag=r.skip?'<span class="bad-t">跳过</span>':r.wrong?'<span class="bad-t">写错过</span>':'<span class="ok-t">一次写对</span>';
    return '<div class="item"><div class="f"><div class="w">'+w.w+'</div><div class="m">'+w.ipa+'　'+w.zh+'</div></div>'+tag+'</div>';}).join('');
  if(S.mode==='group'){$('sumRetry').textContent='重练本组';$('sumNext').textContent=S.g<NG-1?'下一组':'回首页';}
  else{$('sumRetry').textContent='重练这几个';$('sumNext').textContent=mistWords().length?'继续练错题':'错题已清空';$('sumNext').disabled=!mistWords().length;}
}
$('sumRetry').onclick=()=>{S={...S,i:0,res:{}};learnShow();};
$('sumNext').onclick=()=>{$('sumNext').disabled=false;if(S.mode==='group'){if(S.g<NG-1)startGroup(S.g+1);else goHome();}else startMist();};
$('sumHome').onclick=goHome;
// ---------- 错题本 ----------
function mistShow(){
  show('vMist');const ws=mistWords();
  $('mistInfo').textContent=ws.length?'共 '+ws.length+' 个；在错题练习中连续 2 次一次写对会自动移出':'暂时没有错题 👍';
  $('mistList').innerHTML=ws.map(k=>{const w=byW[k],m=st.mist[k];return '<div class="item"><div class="f"><div class="w">'+w.w+' <span style="font-size:15px;font-weight:400;color:#557">'+w.ipa+'</span></div><div class="m">'+w.pos+' '+w.zh+'</div><div class="c">错 '+m.n+' 次'+(m.streak?' · 已连对 '+m.streak+' 次':'')+'</div></div><button class="snd" data-say="'+w.w+'">🔊</button><button data-del="'+w.w+'">移除</button></div>';}).join('');
  $('mistPractice').disabled=!ws.length;}
$('mistList').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.say)say(b.dataset.say,true);
  if(b.dataset.del){delete st.mist[b.dataset.del];save();mistShow();}};
$('mistPractice').onclick=startMist;$('mistBack').onclick=goHome;
// ---------- 首页 ----------
function goHome(){
  show('vHome');const nd=Object.keys(st.done).length;
  $('homeProg').innerHTML='已完成 <b>'+nd+'</b> / '+NG+' 组（'+Math.min(nd*G,WORDS.length)+' 个单词）<br>当前：第 <b>'+(st.cur+1)+'</b> 组';
  $('homeBar').style.width=(nd/NG*100)+'%';
  const mc=mistWords().length;$('btnMistakes').textContent='错题本'+(mc?'（'+mc+'）':'');
  $('groupGrid').innerHTML=Array.from({length:NG},(_,g)=>'<button data-g="'+g+'" class="'+(st.done[g]?'done ':'')+(g===st.cur?'cur':'')+'">第'+(g+1)+'组<br><span style="font-size:11px;opacity:.75">'+WORDS[g*G].w+'…</span></button>').join('');}
$('groupGrid').onclick=e=>{const b=e.target.closest('button');if(b){st.cur=+b.dataset.g;save();startGroup(st.cur);}};
$('btnContinue').onclick=()=>startGroup(st.cur);
$('btnMistakes').onclick=mistShow;
function setZhL(){$('dZhL').innerHTML='';$('dZhL').append($('dZh').textContent);if($('dHint').textContent){const sm=document.createElement('small');sm.textContent=$('dHint').textContent;$('dZhL').append(sm);}}
let rzT;const onRz=()=>{clearTimeout(rzT);rzT=setTimeout(updLand,60);};
window.addEventListener('resize',onRz);window.addEventListener('orientationchange',()=>setTimeout(updLand,250));
$('rotBtn').onclick=async()=>{
  if(sim){sim=false;updLand();return;}
  let ok=false;
  try{if(screen.orientation&&screen.orientation.lock){
      if(document.documentElement.requestFullscreen&&!document.fullscreenElement){try{await document.documentElement.requestFullscreen();}catch(e){}}
      await screen.orientation.lock('landscape');ok=true;}}catch(e){ok=false;}
  if(!ok)$('rotTip').style.display='flex';};
$('rotClose').onclick=()=>{$('rotTip').style.display='none';};
$('rotSim').onclick=()=>{$('rotTip').style.display='none';sim=true;updLand();};
HW.loadModel('').then(()=>{$('loading').style.display='none';goHome();}).catch(e=>{$('loading').textContent='加载失败，请刷新重试';});
window.__app={strokes:()=>strokes,state:()=>st,session:()=>S,setStrokes:s=>{strokes=s;redraw();},say};
})();

</script>
</body>
